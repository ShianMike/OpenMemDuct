name: Package
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test -- --run
      - run: npm run build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - run: npm run tauri -- build --target x86_64-pc-windows-msvc --bundles nsis --ci
      - name: Validate installer and generate SHA256SUMS
        id: installer
        shell: pwsh
        run: |
          $bundleDir = 'src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis'
          $version = (Get-Content -LiteralPath src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $expectedName = "OpenMemDuct_${version}_x64-setup.exe"
          $installers = @(Get-ChildItem -LiteralPath $bundleDir -Filter *.exe -File -ErrorAction Stop)
          if ($installers.Count -ne 1 -or $installers[0].Name -cne $expectedName -or $installers[0].Length -eq 0) {
            throw "Expected exactly one non-empty NSIS installer: $expectedName"
          }
          $hash = (Get-FileHash -LiteralPath $installers[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($installers[0].Name)" | Set-Content -LiteralPath "$bundleDir/SHA256SUMS" -Encoding ascii
          "version=$version" | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8
          "path=$bundleDir/$expectedName" | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: OpenMemDuct_${{ steps.installer.outputs.version }}_windows_x64
          path: |
            ${{ steps.installer.outputs.path }}
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/SHA256SUMS
          if-no-files-found: error
