name: Checks
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Source checks
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check updater artifact helper
        shell: pwsh
        run: ./scripts/prepare-updater-artifacts.ps1 -SelfCheck
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test -- --run
      - run: npm run build
      - name: Verify Windows dependency boundary
        shell: pwsh
        run: |
          $dependencies = cargo tree --locked --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc --edges normal,build,dev --prefix none --format '{p}'
          if ($LASTEXITCODE -ne 0) { throw 'Could not inspect Windows dependencies.' }
          if ($dependencies -match '^glib v') { throw 'glib is now a Windows dependency. Reassess GHSA-wrw7-89jp-8q8g before building.' }
          foreach ($dependency in $dependencies) {
            if ($dependency -match '^zip v(\S+)') {
              $zipVersion = $Matches[1]
              if ($zipVersion -notmatch '^\d+\.\d+\.\d+$' -or [version]$zipVersion -lt [version]'9.0.5') {
                throw "zip $zipVersion is affected by reviewed archive advisories. Require a patched stable version >=9.0.5."
              }
            }
          }
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - run: cargo run --locked --manifest-path src-tauri/Cargo.toml --bin openmemduct -- --helper-self-test
