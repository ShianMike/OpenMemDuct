[package]
name = "openmemduct"
version = "0.1.1"
description = "A Windows memory monitor and cleanup app built with React, Tauri, and Rust"
authors = ["OpenMemDuct contributors"]
edition = "2021"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/ShianMike/OpenMemDuct"
homepage = "https://github.com/ShianMike/OpenMemDuct"
default-run = "openmemduct"

[lib]
name = "openmemduct_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation", "Win32_System_ProcessStatus", "Win32_System_Threading",
  "Win32_System_Memory", "Win32_System_Diagnostics_ToolHelp", "Win32_System_SystemInformation",
  "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography",
  "Win32_System_Pipes", "Win32_Storage_FileSystem", "Win32_System_IO",
  "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_WindowsProgramming",
  "Win32_System_LibraryLoader", "Win32_System_Registry", "Wdk_System_SystemInformation", "Win32_Graphics_Gdi"
] }
